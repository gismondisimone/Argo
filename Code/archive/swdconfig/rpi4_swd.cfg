# Configurazione SWD Bitbang per Raspberry Pi 4
adapter driver bcm2835gpio

# Indirizzo periferico base per BCM2711 (Raspberry Pi 4)
bcm2835gpio_peripheral_base 0xFE000000
bcm2835gpio_speed_coeffs 236181 60

# Trasporto SWD
transport select swd

# Definizione dei pin usati (SWCLK=24, SWDIO=25)
bcm2835gpio_swd_nums 24 25

# Definizione pin di Reset (opzionale - GPIO 18)
bcm2835gpio_srst_num 18

# Configurazione della frequenza dell'adapter
adapter speed 1000